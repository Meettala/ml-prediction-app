<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ML Prediction App architecture</title>
  <desc id="desc">California Housing data flows through audited cleaning, deterministic train validation test separation, validation model selection, final test evaluation and FastAPI or Streamlit interfaces.</desc>
  <rect width="1200" height="620" rx="28" fill="#0b1220"/>
  <text x="60" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">ML Prediction App — Evidence to Estimate</text>
  <text x="60" y="108" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Validation-based model selection • untouched final test • validated artifacts</text>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <g fill="#172554" stroke="#60a5fa" stroke-width="2">
      <rect x="45" y="190" width="170" height="96" rx="16"/>
      <rect x="250" y="190" width="170" height="96" rx="16"/>
      <rect x="455" y="190" width="200" height="96" rx="16"/>
      <rect x="690" y="190" width="190" height="96" rx="16"/>
      <rect x="915" y="190" width="235" height="96" rx="16"/>
    </g>
    <g fill="#f8fafc">
      <text x="130" y="232">Historical public</text><text x="130" y="257">block-group data</text>
      <text x="335" y="232">Audited fixed</text><text x="335" y="257">cleaning</text>
      <text x="555" y="223">Train / validation /</text><text x="555" y="248">final-test split</text><text x="555" y="273">final test first</text>
      <text x="785" y="232">Validation RMSE</text><text x="785" y="257">model selection</text>
      <text x="1032" y="223">Refit selected model</text><text x="1032" y="248">+ final test</text><text x="1032" y="273">+ versioned bundle</text>
    </g>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M215 238h29"/><path d="M420 238h29"/><path d="M655 238h29"/><path d="M880 238h29"/>
    <path d="M1032 286v76H420v58"/><path d="M1032 362H820v58"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <g font-family="Arial, sans-serif" font-size="19" text-anchor="middle">
    <rect x="260" y="420" width="320" height="116" rx="18" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="660" y="420" width="320" height="116" rx="18" fill="#3b1d0b" stroke="#fb923c" stroke-width="2"/>
    <text x="420" y="462" fill="#f8fafc" font-weight="700">FastAPI</text>
    <text x="420" y="492" fill="#cbd5e1">strict schema • feature order</text>
    <text x="420" y="518" fill="#cbd5e1">finite estimate • safe errors</text>
    <text x="820" y="462" fill="#f8fafc" font-weight="700">Streamlit</text>
    <text x="820" y="492" fill="#cbd5e1">validation • final metrics • importance</text>
    <text x="820" y="518" fill="#cbd5e1">historical-data disclaimer</text>
  </g>
  <text x="600" y="585" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Illustrative estimates from 1990 block-group data — not property valuations or financial advice.</text>
</svg>
