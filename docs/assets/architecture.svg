<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ML Prediction App architecture</title>
  <desc id="desc">California Housing data flows through cleaning, deterministic splitting, model training, validation and FastAPI or Streamlit prediction interfaces.</desc>
  <rect width="1200" height="620" rx="28" fill="#0b1220"/>
  <text x="60" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">ML Prediction App — Evidence to Estimate</text>
  <text x="60" y="108" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Reproducible training, validated artifacts and transparent limitations</text>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <g fill="#172554" stroke="#60a5fa" stroke-width="2">
      <rect x="55" y="190" width="180" height="96" rx="16"/>
      <rect x="275" y="190" width="180" height="96" rx="16"/>
      <rect x="495" y="190" width="180" height="96" rx="16"/>
      <rect x="715" y="190" width="180" height="96" rx="16"/>
      <rect x="935" y="190" width="210" height="96" rx="16"/>
    </g>
    <g fill="#f8fafc">
      <text x="145" y="232">Public aggregate</text><text x="145" y="257">housing data</text>
      <text x="365" y="232">Transparent</text><text x="365" y="257">cleaning</text>
      <text x="585" y="232">Deterministic</text><text x="585" y="257">train/test split</text>
      <text x="805" y="232">Baseline +</text><text x="805" y="257">Random Forest</text>
      <text x="1040" y="223">Held-out metrics</text><text x="1040" y="248">+ versioned</text><text x="1040" y="273">model bundle</text>
    </g>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M235 238h34"/><path d="M455 238h34"/><path d="M675 238h34"/><path d="M895 238h34"/>
    <path d="M1040 286v76H420v58"/><path d="M1040 362H820v58"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <g font-family="Arial, sans-serif" font-size="19" text-anchor="middle">
    <rect x="260" y="420" width="320" height="116" rx="18" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="660" y="420" width="320" height="116" rx="18" fill="#3b1d0b" stroke="#fb923c" stroke-width="2"/>
    <text x="420" y="462" fill="#f8fafc" font-weight="700">FastAPI</text>
    <text x="420" y="492" fill="#cbd5e1">strict schema • feature order</text>
    <text x="420" y="518" fill="#cbd5e1">finite prediction • safe errors</text>
    <text x="820" y="462" fill="#f8fafc" font-weight="700">Streamlit</text>
    <text x="820" y="492" fill="#cbd5e1">metrics • importance • controls</text>
    <text x="820" y="518" fill="#cbd5e1">historical-data disclaimer</text>
  </g>
  <text x="600" y="585" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Estimates are educational outputs from 1990 block-group data — not property valuations or financial advice.</text>
</svg>
