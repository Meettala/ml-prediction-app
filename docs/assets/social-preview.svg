<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ML Prediction App social preview</title>
  <desc id="desc">Portfolio preview for a reproducible California Housing machine-learning application with FastAPI, Streamlit and validated model artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="90" r="190" fill="#1d4ed8" opacity="0.22"/>
  <circle cx="100" cy="610" r="240" fill="#0f766e" opacity="0.18"/>
  <text x="72" y="126" fill="#93c5fd" font-family="Arial, sans-serif" font-size="24" font-weight="700">PORTFOLIO PROJECT</text>
  <text x="72" y="208" fill="#f8fafc" font-family="Arial, sans-serif" font-size="58" font-weight="800">ML Prediction App</text>
  <text x="72" y="264" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="28">California Housing regression — from data to deployed API</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#e2e8f0">
    <text x="88" y="350">✓ Deterministic train/test evaluation</text>
    <text x="88" y="394">✓ Linear baseline + Random Forest</text>
    <text x="88" y="438">✓ Versioned model bundle and schema validation</text>
    <text x="88" y="482">✓ FastAPI • Streamlit • Docker • CI</text>
  </g>
  <rect x="820" y="176" width="380" height="310" rx="30" fill="url(#card)" opacity="0.92"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="1010" y="244" fill="#dbeafe" font-size="21">TRUSTED PIPELINE</text>
    <text x="1010" y="306" fill="#fff" font-size="31" font-weight="700">Data → Model</text>
    <text x="1010" y="350" fill="#fff" font-size="31" font-weight="700">Model → API</text>
    <text x="1010" y="408" fill="#dbeafe" font-size="20">validated features</text>
    <text x="1010" y="440" fill="#dbeafe" font-size="20">finite estimates</text>
  </g>
  <text x="72" y="574" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">Historical block-group estimate • not a property valuation or financial advice</text>
</svg>
